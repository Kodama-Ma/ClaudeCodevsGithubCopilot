<!doctype html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { font-family: -apple-system, "Hiragino Sans", sans-serif; }
  body { margin: 0; background: #f6f7f9; color: #1f2328; }
  header { background: #1f2328; color: #fff; padding: 16px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  header .meta { opacity: .7; font-size: 12px; margin-top: 4px; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { border: 1px solid #d0d7de; background: #fff; padding: 7px 16px;
                 border-radius: 8px; cursor: pointer; font-size: 13px; }
  .tabs button.active { background: #1f2328; color: #fff; border-color: #1f2328; }
  .panel { display: none; }
  .panel.active { display: block; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d0d7de; padding: 6px 8px; font-size: 13px; text-align: left; }
  th { background: #f0f3f6; }
  td.ro { color: #57606a; background: #fafbfc; }
  td.cost { text-align: right; font-variant-numeric: tabular-nums; }
  select { font: inherit; padding: 3px 4px; border: 1px solid #d0d7de; border-radius: 6px; max-width: 160px; }
  .bar { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
  .bar .total { font-size: 15px; font-weight: 700; }
  button.act { border: 1px solid #1f2328; background: #1f2328; color: #fff;
               padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .exportbar { text-align: right; margin-bottom: 10px; }
  button.export { border: 1px solid #1a7f37; background: #1f883d; color: #fff;
                  padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button.export:hover { background: #1a7f37; }
  button.export:disabled { opacity: .6; cursor: default; }
  .msg { margin-left: auto; font-size: 13px; }
  .msg.ok { color: #1a7f37; } .msg.err { color: #cf222e; }
  .summary td.cost { font-weight: 700; }
  .loading, .error { padding: 40px; text-align: center; color: #656d76; }
  .error { color: #cf222e; }
  .warn { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 8px;
          padding: 12px 16px; margin-top: 16px; font-size: 13px; }
  .warn h3 { margin: 0 0 6px; font-size: 14px; }
  .warn code { background: #fff; border: 1px solid #eac54f; border-radius: 4px; padding: 1px 6px; }
  .ok-note { color: #1a7f37; font-size: 13px; margin-top: 16px; }
  .hint { color: #656d76; font-size: 12px; margin: 4px 0 0; }
  .sec { font-size: 15px; margin: 22px 0 8px; }
  .sec:first-child { margin-top: 0; }
  .forbidden { text-align: center; padding: 64px 24px; color: #57606a; }
  .forbidden .lock { font-size: 48px; }
  .forbidden h2 { margin: 12px 0 8px; color: #1f2328; }
  .forbidden .who { margin-top: 20px; font-size: 12px; color: #8c959f; }
  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .filterbar input[type=search] { padding: 5px 8px; border: 1px solid #d0d7de; border-radius: 6px;
                                  font: inherit; min-width: 180px; }
  .filterbar select { font: inherit; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; }
  .filterbar .chk { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .filterbar .count { font-size: 12px; color: #656d76; margin-left: auto; }
  .bulkbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 22px;
             margin-bottom: 10px; padding: 7px 12px; background: #eef2f5; border-radius: 8px; }
  .bulkbar .bulkhint { font-size: 12px; color: #656d76; }
  .bulkbar .bulkn { font-size: 13px; font-weight: 700; }
  .bulkbar select { font: inherit; padding: 4px 6px; border: 1px solid #d0d7de; border-radius: 6px; }
  button.ghost { border: 1px solid #d0d7de; background: #fff; padding: 6px 12px;
                 border-radius: 8px; cursor: pointer; font-size: 13px; }
  th.cbcol, td.cbcol { width: 34px; text-align: center; padding: 4px; }
</style>
</head>
<body>
<header>
  <h1>AIツール ライセンス管理</h1>
  <div class="meta" id="meta">読み込み中…</div>
</header>
<main>
  <div id="root" class="loading">データを読み込んでいます…</div>
</main>

<script>
  let DATA = null;
  let PRICE = {};         // "ツール||プラン" -> 月額単価(number)
  let TOOLS = [];
  let PLANS = [];
  const state = {};       // dept -> rows[]
  const filters = {};     // 'All' or dept -> フィルタ条件
  const selected = {};    // dept -> Set(github-id) 一括操作の選択

  google.script.run.withSuccessHandler(onData).withFailureHandler(onFail).getBootstrap();

  function onFail(err) {
    const r = document.getElementById('root');
    r.className = 'error'; r.textContent = 'エラー: ' + err.message;
  }

  function onData(d) {
    if (d.forbidden) {
      document.getElementById('meta').textContent = d.email || '';
      const r = document.getElementById('root');
      r.className = 'forbidden';
      r.innerHTML =
        '<div class="lock">🔒</div>' +
        '<h2>アクセス権限がありません</h2>' +
        '<p>このアプリを利用する権限が割り当てられていません。<br>必要な場合は管理者にご連絡ください。</p>' +
        (d.email ? '<p class="who">' + esc(d.email) + '</p>' : '');
      return;
    }
    if (d.error) {
      document.getElementById('meta').textContent = d.email || '';
      onFail({ message: d.error });
      return;
    }
    DATA = d;
    document.getElementById('meta').textContent =
      d.email + (d.isAdmin ? '（管理者）' : '（' + d.depts.join('・') + ' 担当）');

    d.prices.forEach(p => { PRICE[p['ツール'] + '||' + p['プラン']] = Number(p['月額単価']) || 0; });
    TOOLS = ['配布なし', ...new Set(d.prices.map(p => p['ツール']).filter(Boolean))];
    PLANS = ['', ...new Set(d.prices.map(p => p['プラン']).filter(Boolean))];

    d.depts.forEach(dept => {
      state[dept] = d.people.filter(r => r['部'] === dept).map(r => Object.assign({}, r));
    });

    render();
  }

  function costOf(row) {
    if (!row['ツール'] || row['ツール'] === '配布なし') return 0;
    return PRICE[row['ツール'] + '||' + row['プラン']] || 0;
  }
  function yen(n) { return '¥' + (n || 0).toLocaleString('ja-JP'); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }
  function option(value, current) {
    return '<option value="' + esc(value) + '"' + (value === current ? ' selected' : '') + '>' +
      (value || '(なし)') + '</option>';
  }

  function render() {
    const root = document.getElementById('root');
    root.className = ''; root.innerHTML = '';
    const tabs = document.createElement('div'); tabs.className = 'tabs';
    const panels = document.createElement('div');

    // 先頭は全メンバー一覧の「All」タブ、各部のタブ、最後に費用サマリータブ
    const views = ['All', ...DATA.depts, '費用サマリー'];

    views.forEach((name, i) => {
      const btn = document.createElement('button');
      btn.textContent = name; btn.className = i === 0 ? 'active' : '';
      btn.onclick = () => {
        [...tabs.children].forEach(b => b.classList.remove('active'));
        [...panels.children].forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + i).classList.add('active');
      };
      tabs.appendChild(btn);

      const panel = document.createElement('div');
      panel.className = 'panel' + (i === 0 ? ' active' : '');
      panel.id = 'panel-' + i;
      if (name === 'All') {
        panel.appendChild(exportBar());                  // 書き出しボタンは Allタブだけ
        panel.appendChild(membersView());
      } else if (name === '費用サマリー') {
        panel.appendChild(costView());
      } else {
        panel.appendChild(deptView(name));
      }
      panels.appendChild(panel);
    });

    root.appendChild(tabs);
    root.appendChild(panels);
    // DOM挿入後に再描画して、件数表示・一括バーを確定させる
    renderMembers(document.getElementById('members'));
    DATA.depts.forEach(dept => {
      renderTable(document.getElementById('tbl-' + dept), dept);
      updateTotal(dept);
    });
  }

  function uniq(arr) { return [...new Set(arr)]; }

  function ensureFilter(key) {
    if (!filters[key]) filters[key] = { kw: '', dept: '', group: '', tool: '', plan: '', noneOnly: false };
    return filters[key];
  }

  // 1行がフィルタ条件を通過するか（kw=氏名/ID/グループの部分一致、各select=完全一致）
  function passFilter(row, f) {
    if (f.kw) {
      const hay = ((row['github-id'] || '') + ' ' + (row['氏名'] || '') + ' ' + (row['グループ'] || '')).toLowerCase();
      if (hay.indexOf(f.kw.toLowerCase().trim()) === -1) return false;
    }
    if (f.dept && row['部'] !== f.dept) return false;
    if (f.group && row['グループ'] !== f.group) return false;
    if (f.tool && row['ツール'] !== f.tool) return false;
    if (f.plan && row['プラン'] !== f.plan) return false;
    if (f.noneOnly && row['ツール'] && row['ツール'] !== '配布なし') return false;
    return true;
  }

  function selFilter(label, values, current, onchange) {
    const s = document.createElement('select');
    s.innerHTML = '<option value="">' + label + ': すべて</option>' +
      values.map(v => '<option value="' + esc(v) + '"' + (v === current ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
    s.onchange = () => onchange(s.value);
    return s;
  }

  // フィルタバー（All=部で絞る／各部タブ=グループで絞る）
  function filterBar(scope) {
    const isAll = scope === 'All';
    const f = ensureFilter(scope);
    const bar = document.createElement('div'); bar.className = 'filterbar';

    const kw = document.createElement('input');
    kw.type = 'search';
    kw.placeholder = '🔍 氏名 / github-id' + (isAll ? ' / グループ' : ' / グループ');
    kw.value = f.kw;
    kw.oninput = () => { f.kw = kw.value; refilter(scope); };
    bar.appendChild(kw);

    if (isAll) {
      bar.appendChild(selFilter('部', DATA.allDepts, f.dept, v => { f.dept = v; refilter(scope); }));
    } else {
      const groups = uniq(state[scope].map(r => r['グループ']).filter(Boolean));
      bar.appendChild(selFilter('グループ', groups, f.group, v => { f.group = v; refilter(scope); }));
    }
    bar.appendChild(selFilter('ツール', TOOLS.filter(t => t !== '配布なし'), f.tool, v => { f.tool = v; refilter(scope); }));
    bar.appendChild(selFilter('プラン', PLANS.filter(Boolean), f.plan, v => { f.plan = v; refilter(scope); }));

    const lbl = document.createElement('label'); lbl.className = 'chk';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = f.noneOnly;
    cb.onchange = () => { f.noneOnly = cb.checked; refilter(scope); };
    lbl.appendChild(cb); lbl.appendChild(document.createTextNode(' 配布なしのみ'));
    bar.appendChild(lbl);

    const count = document.createElement('span'); count.className = 'count'; count.id = 'count-' + scope;
    bar.appendChild(count);
    return bar;
  }

  function refilter(scope) {
    if (scope === 'All') renderMembers(document.getElementById('members'));
    else renderTable(document.getElementById('tbl-' + scope), scope);
  }

  function exportBar() {
    const bar = document.createElement('div'); bar.className = 'exportbar';
    const b = document.createElement('button'); b.className = 'export';
    b.textContent = '⬇ メンバー一覧をスプレッドシートに書き出して開く';
    b.onclick = () => {
      if (!confirm('全社のメンバー一覧を、共有スプレッドシートに書き出して開きます。\nよろしいですか？')) return;
      const old = b.textContent; b.disabled = true; b.textContent = '書き出し中…';
      google.script.run
        .withSuccessHandler(res => {
          b.disabled = false; b.textContent = old;
          window.open(res.url, '_blank');
        })
        .withFailureHandler(err => {
          b.disabled = false; b.textContent = old;
          alert('エラー: ' + err.message);
        })
        .exportAll();
    };
    bar.appendChild(b);
    return bar;
  }

  function deptView(dept) {
    const wrap = document.createElement('div');
    wrap.appendChild(filterBar(dept));

    const bulk = document.createElement('div'); bulk.className = 'bulkbar'; bulk.id = 'bulk-' + dept;
    wrap.appendChild(bulk);

    const table = document.createElement('table');
    table.id = 'tbl-' + dept;
    renderTable(table, dept);
    wrap.appendChild(table);

    const hint = document.createElement('p');
    hint.className = 'hint';
    hint.textContent = '※ github-id・氏名・グループは Organization シートで管理（ここでは編集不可）。メンバーの増減は Organization で行います。';
    wrap.appendChild(hint);

    const bar = document.createElement('div'); bar.className = 'bar';
    const total = document.createElement('span'); total.className = 'total'; total.id = 'total-' + dept;
    const save = document.createElement('button'); save.className = 'act'; save.textContent = '保存';
    const msg = document.createElement('span'); msg.className = 'msg'; msg.id = 'msg-' + dept;
    save.onclick = () => doSave(dept, save, msg);
    bar.appendChild(total); bar.appendChild(save); bar.appendChild(msg);
    wrap.appendChild(bar);
    return wrap;
  }

  function renderTable(table, dept) {
    if (!table) return;
    const f = ensureFilter(dept);
    const rows = state[dept];
    const sel = selected[dept] || (selected[dept] = new Set());

    let html = '<thead><tr>' +
      '<th class="cbcol"><input type="checkbox" id="selall-' + esc(dept) + '"></th>' +
      ['github-id', 'グループ', '氏名', 'ツール', 'プラン', '月額'].map(h => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>';
    let shown = 0;
    rows.forEach((r, idx) => {
      if (!passFilter(r, f)) return;
      shown++;
      const checked = sel.has(r['github-id']) ? ' checked' : '';
      html += '<tr>' +
        '<td class="cbcol"><input type="checkbox" class="rowcb" data-d="' + esc(dept) + '" data-id="' + esc(r['github-id']) + '"' + checked + '></td>' +
        '<td class="ro">' + esc(r['github-id']) + '</td>' +
        '<td class="ro">' + esc(r['グループ']) + '</td>' +
        '<td class="ro">' + esc(r['氏名']) + '</td>' +
        '<td><select data-d="' + esc(dept) + '" data-i="' + idx + '" data-k="ツール">' + TOOLS.map(t => option(t, r['ツール'])).join('') + '</select></td>' +
        '<td><select data-d="' + esc(dept) + '" data-i="' + idx + '" data-k="プラン">' + PLANS.map(p => option(p, r['プラン'])).join('') + '</select></td>' +
        '<td class="cost" id="cost-' + esc(dept) + '-' + idx + '">' + yen(costOf(r)) + '</td>' +
        '</tr>';
    });
    if (rows.length === 0) {
      html += '<tr><td colspan="7" class="ro">この部のメンバーが Organization シートにいません。</td></tr>';
    } else if (shown === 0) {
      html += '<tr><td colspan="7" class="ro">該当するメンバーがいません。</td></tr>';
    }
    html += '</tbody>';
    table.innerHTML = html;
    table.querySelectorAll('select').forEach(el => el.addEventListener('change', onEdit));
    table.querySelectorAll('.rowcb').forEach(el => el.addEventListener('change', onRowCheck));
    const selall = document.getElementById('selall-' + dept);
    if (selall) selall.addEventListener('change', () => onSelectAll(dept, selall.checked));

    const c = document.getElementById('count-' + dept);
    if (c) c.textContent = '該当 ' + shown + ' / ' + rows.length + ' 名';
    updateBulkBar(dept);
  }

  function onEdit(e) {
    const el = e.target;
    const dept = el.dataset.d, i = Number(el.dataset.i), k = el.dataset.k;
    state[dept][i][k] = el.value;
    if (k === 'ツール' && el.value === '配布なし') state[dept][i]['プラン'] = '';
    document.getElementById('cost-' + dept + '-' + i).textContent = yen(costOf(state[dept][i]));
    updateTotal(dept);
    refreshSummary();
  }

  // ===== 一括操作（各部タブ）=====
  function onRowCheck(e) {
    const el = e.target, dept = el.dataset.d, id = el.dataset.id;
    const sel = selected[dept] || (selected[dept] = new Set());
    if (el.checked) sel.add(id); else sel.delete(id);
    updateBulkBar(dept);
  }
  function onSelectAll(dept, checked) {
    const f = ensureFilter(dept);
    const sel = selected[dept] || (selected[dept] = new Set());
    state[dept].forEach(r => {
      if (passFilter(r, f)) { if (checked) sel.add(r['github-id']); else sel.delete(r['github-id']); }
    });
    renderTable(document.getElementById('tbl-' + dept), dept);
  }
  function updateBulkBar(dept) {
    const bar = document.getElementById('bulk-' + dept);
    if (!bar) return;
    const sel = selected[dept] || new Set();
    if (sel.size === 0) {
      bar.innerHTML = '<span class="bulkhint">行の左のチェックで選ぶと、まとめてツール／プランを設定できます。</span>';
      return;
    }
    bar.innerHTML =
      '<span class="bulkn">選択中 ' + sel.size + '名</span>' +
      '<select id="bulktool-' + esc(dept) + '"><option value="">ツール…</option>' + TOOLS.map(t => '<option value="' + esc(t) + '">' + (t || '(なし)') + '</option>').join('') + '</select>' +
      '<select id="bulkplan-' + esc(dept) + '"><option value="">プラン…</option>' + PLANS.filter(Boolean).map(p => '<option value="' + esc(p) + '">' + esc(p) + '</option>').join('') + '</select>' +
      '<button class="act" id="bulkapply-' + esc(dept) + '">一括適用</button>' +
      '<button class="ghost" id="bulkclear-' + esc(dept) + '">選択解除</button>';
    document.getElementById('bulkapply-' + dept).onclick = () => applyBulk(dept);
    document.getElementById('bulkclear-' + dept).onclick = () => {
      selected[dept].clear();
      renderTable(document.getElementById('tbl-' + dept), dept);
    };
  }
  function applyBulk(dept) {
    const sel = selected[dept];
    if (!sel || sel.size === 0) return;
    const tool = document.getElementById('bulktool-' + dept).value;
    if (!tool) { alert('ツールを選んでください（「配布なし」を選べば一括で剥奪できます）。'); return; }
    const plan = document.getElementById('bulkplan-' + dept).value;
    state[dept].forEach(r => {
      if (sel.has(r['github-id'])) {
        r['ツール'] = tool;
        r['プラン'] = (tool === '配布なし') ? '' : plan;
      }
    });
    renderTable(document.getElementById('tbl-' + dept), dept);
    updateTotal(dept);
    refreshSummary();
  }

  function deptTotal(dept) { return state[dept].reduce((s, r) => s + costOf(r), 0); }
  function updateTotal(dept) {
    const el = document.getElementById('total-' + dept);
    if (el) el.textContent = dept + ' 月額合計: ' + yen(deptTotal(dept));
  }

  // Allタブ：全メンバー一覧（全部署を一括表示・閲覧専用。編集は各部タブで）
  function membersView() {
    const wrap = document.createElement('div');
    wrap.appendChild(filterBar('All'));
    const div = document.createElement('div'); div.id = 'members';
    renderMembers(div);
    wrap.appendChild(div);
    return wrap;
  }
  function renderMembers(div) {
    if (!div) return;
    // 自分が編集中の値（担当部のみ）を github-id で引けるように、現在値で組み立て
    const edited = {};
    DATA.depts.forEach(dept => state[dept].forEach(r => edited[r['github-id']] = r));
    const all = DATA.allPeople.map(r => {
      const e = edited[r['github-id']];
      return e ? Object.assign({}, r, { 'ツール': e['ツール'], 'プラン': e['プラン'] }) : r;
    });

    const f = ensureFilter('All');
    const list = all.filter(r => passFilter(r, f));

    let html = '<table><thead><tr>' +
      ['github-id', '部', 'グループ', '氏名', 'ツール', 'プラン'].map(h => '<th>' + h + '</th>').join('') +
      '</tr></thead><tbody>';
    if (list.length === 0) {
      html += '<tr><td colspan="6" class="ro">該当するメンバーがいません。</td></tr>';
    }
    list.forEach(r => {
      const none = !r['ツール'] || r['ツール'] === '配布なし';
      html += '<tr>' +
        '<td class="ro">' + esc(r['github-id']) + '</td>' +
        '<td class="ro">' + esc(r['部']) + '</td>' +
        '<td class="ro">' + esc(r['グループ']) + '</td>' +
        '<td class="ro">' + esc(r['氏名']) + '</td>' +
        '<td' + (none ? ' class="ro"' : '') + '>' + esc(r['ツール']) + '</td>' +
        '<td' + (none ? ' class="ro"' : '') + '>' + esc(r['プラン']) + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    div.innerHTML = html;
    const c = document.getElementById('count-All');
    if (c) c.textContent = '該当 ' + list.length + ' / ' + all.length + ' 名';
  }

  // 最後のタブ：費用サマリー（部別・全社合計）＋ GitHub突合の警告
  function costView() {
    const div = document.createElement('div'); div.id = 'cost';
    renderCost(div);
    return div;
  }
  function renderCost(div) {
    let grand = 0;
    let html = '<h2 class="sec">費用サマリー</h2>';
    html += '<table class="summary"><thead><tr><th>部</th><th>付与数</th><th>月額</th></tr></thead><tbody>';
    DATA.depts.forEach(dept => {
      const t = deptTotal(dept); grand += t;
      const cnt = state[dept].filter(r => r['ツール'] && r['ツール'] !== '配布なし').length;
      html += '<tr><td>' + esc(dept) + '</td><td>' + cnt + '</td><td class="cost">' + yen(t) + '</td></tr>';
    });
    const totalLabel = DATA.isAdmin ? '全社合計' : '合計';
    html += '<tr><td><b>' + totalLabel + '</b></td><td></td><td class="cost"><b>' + yen(grand) + '</b></td></tr>';
    html += '</tbody></table><p class="hint">※ 各部タブでの未保存の変更も即時反映されます'
      + (DATA.isAdmin ? '' : '（費用は担当部のみ表示）') + '</p>';
    html += warningsHtml();
    div.innerHTML = html;
  }

  // 各部タブで編集したら、Allのメンバー一覧と費用サマリーを再描画
  function refreshSummary() {
    const m = document.getElementById('members'); if (m) renderMembers(m);
    const c = document.getElementById('cost'); if (c) renderCost(c);
  }

  function warningsHtml() {
    const w = DATA.warnings;
    if (!w) return '';
    if (!w.csvLoaded) {
      return '<p class="hint">※ github_licenses シートにGitHub Enterprise CloudのCSVを貼ると、登録漏れ・退職放置の突合が出ます。</p>';
    }
    const blocks = [];
    if (w.unregistered && w.unregistered.length) {
      blocks.push('<h3>⚠️ GitHubにいるが未登録（Organizationに追加すべき人）</h3>' +
        w.unregistered.map(id => '<code>' + esc(id) + '</code>').join(' '));
    }
    if (w.leftover && w.leftover.length) {
      blocks.push('<h3>⚠️ ライセンス付与済みだがGitHubにいない（退職・剥奪漏れの疑い）</h3>' +
        w.leftover.map(id => '<code>' + esc(id) + '</code>').join(' '));
    }
    if (blocks.length === 0) {
      return '<p class="ok-note">✅ GitHub Enterprise の名簿と一致。登録漏れ・放置はありません。</p>';
    }
    return '<div class="warn">' + blocks.join('<div style="height:10px"></div>') + '</div>';
  }

  function doSave(dept, btn, msg) {
    btn.disabled = true; msg.className = 'msg'; msg.textContent = '保存中…';
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false; msg.className = 'msg ok';
        msg.textContent = '保存しました（付与 ' + res.count + ' 件）';
      })
      .withFailureHandler(err => {
        btn.disabled = false; msg.className = 'msg err'; msg.textContent = 'エラー: ' + err.message;
      })
      .saveDept(dept, state[dept]);
  }
</script>
</body>
</html>
