name: Aggregate licenses & deploy dashboard

# licenses/ か集計スクリプトが main で変わったら、集計してダッシュボードを Pages へ公開する。
on:
  push:
    branches: [main]
    paths:
      - "licenses/**"
      - "scripts/**"
      - ".github/workflows/aggregate.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は最新だけ残す
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate (master.csv + dashboard)
        run: python scripts/aggregate.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
